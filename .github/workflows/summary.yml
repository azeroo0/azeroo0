name: Generate Summary Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          USERNAME: azeroo0
          PLUGINS: |
            most-commit-language
            repos-per-language
            stats